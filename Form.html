<!DOCTYPE html>
<html>
    
    <head>
        <meta name = "viewport" content = "width = device - width, intial-scale=1.0">
        
        <title>
            OnlineClass-Application
        </title>
        
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    
    <body style = "background-color:#ddd4c3;">
	          <div class = "form">
	              
	              <center><h1>Online Turtorial Class - Sign Up</h1></center>
	              
	              <br>
	              
	              <form name ="application" action = "Thankyou.html">
	              
	                <div class="Container">
	                    
                        <div class="question">
                            
                        <b><label for="first_name">First Name</label></b>
                    
                    </div>
                    
                        <div class="inside_text">
                            
                        <input type="text" id="first_name" name="firstname" placeholder="Your name.." required>
                   
                    </div>
                    
                    </div>
                    
                    <div class="Container">
                        
                        <div class="question">
                            
                        <b><label for="Email">Parent / Guardian</label></b>
                    </div>
                    
                    <div class="inside_text">
                        
                        <input type="text" id="Email" name="EmailID" placeholder="Caretaker Email ID.." required>
                        
                    </div>
                </div>
	          
	          <div class="Container">
                    
                    <div class="question">
                    
                    <b><label for="Group">Pick Your Group</label></b>
              </div>
              
              <div class="inside_text">
                    <select id="Group" name="Groups">
                        
                    <option value="junior">Online - Junior Art Class</option>
                    
                    <option value="senior">Online - Senior Art Class</option>
        </select>
        
      </div>
      
    </div>
    
    <div class = "Container">
        
        <div class="question">
                    
                    <b><label for="day">Day of the Week</label></b>
              </div>
        
                <input type="checkbox" id="one" name="one" value="monday">
                
                <label for="one"> Monday </label><br>
                
                <input type="checkbox" id="two" name="two" value="tuesday">
                
                <label for="two"> Tuesday </label><br>
                
                <input type="checkbox" id="three" name="three" value="wednesday">
                
                <label for="three"> Wednesday </label><br>
                
                <input type="checkbox" id="four" name="four" value="thursday">
                
                <label for="four"> Thursday </label><br>
                
                <input type="checkbox" id="five" name="five" value="friday">
                
                <label for="five"> Friday </label><br>
                
                <input type="checkbox" id="six" name="six" value="saturday">
                
                <label for="six"> Saturday </label><br>
        </div>
        
        <div class = "Container">
        
        <div class="question">
                    
                    <b><label for="time">Timings</label></b>
              </div>
        
                <input type="checkbox" id="Time-one" name="Time-one" value="first">
                
                <label for="one"> 4:30pm - 5:30pm </label><br>
                
                <input type="checkbox" id="Time-two" name="Time-two" value="second">
                
                <label for="two"> 6:30pm - 7:30pm </label><br>
                
        </div>
        
        <br>
        
        </br>
        
        <div class="Container">
            
                <input type="submit" value="Submit">
        </div>
        
        <br>
        
        </br>
        
        <h5>*For Cancellation - contact help phone number*</h5>
        
            </form>
	  </div>
	  
	    <script>
	    

	    </script>	  
    </body>
</html>
